name: open-graph-images-generator
base: ubuntu@24.04
version: "1.0.0"
summary: Open Graph Images Generator
description: |
  Open Graph Images Generator is a tool for generating Open Graph images for your social media posts.
platforms:
  amd64:

services:
  go:
    override: replace
    command: node /app/build/index.js
    startup: enabled

parts:
  # Stages only the Node.js runtime binary into the rock. The npm plugin's
  # `craftctl default` is the hook that honors `npm-include-node`, so it must
  # run somewhere — but we don't want its `npm install` polluting the final
  # image (see `app` part comment). Stage filter keeps just `bin/node`.
  runtime:
    plugin: npm
    npm-include-node: true
    npm-node-version: "22"
    source: .
    source-type: local
    override-build: |
      craftctl default
    stage:
      - bin/node

  app:
    plugin: npm
    source: .
    source-type: local
    after: [runtime]
    build-environment:
      - NPM_CONFIG_IGNORE_SCRIPTS: "true"
    overlay-packages:
      - ca-certificates
      - coreutils
      - bash
    override-build: |
      set -eux
      # The npm plugin's default install step uses `npm install` against
      # package.json with no package-lock.json, which re-resolves and
      # bypasses pnpm-lock.yaml (re-introducing CVEs the lockfile pinned
      # away). Skip it and drive the build entirely through pnpm.
      # TODO: replace NPM and Node.js with Bun once this bug fix is live: https://github.com/oven-sh/bun/pull/15047
      npm install -g pnpm
      pnpm install --frozen-lockfile
      pnpm run build
      mkdir -p ${CRAFT_PART_INSTALL}/app
      cp -ar build node_modules package.json ${CRAFT_PART_INSTALL}/app/
